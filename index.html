<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE ON PRIVATE STREAMING 🔥</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial; }
  body { background:#000; color:#fff; text-align:center; }
  .container { max-width:500px; margin:0 auto; background:#111; min-height:100vh; }
  
  /* HALAMAN 1 */
  #page1 img { width:100%; display:block; cursor:pointer; }
  #page1 h1 { font-size:22px; padding:15px; color:#ff0055; font-weight:800; }
  .cta-btn {
    background: linear-gradient(90deg,#ff0055,#ff5500);
    color:#fff; padding:15px; margin:15px; border-radius:10px;
    font-size:18px; font-weight:bold; cursor:pointer;
    box-shadow:0 4px 15px rgba(255,0,85,0.4);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.05);} 100%{transform:scale(1);} }

  /* HALAMAN LOADING */
  #loading { display:none; padding:50px 20px; }
  .spinner {
    border: 6px solid #333;
    border-top: 6px solid #ff0055;
    border-radius: 50%;
    width: 60px; height: 60px;
    animation: spin 1s linear infinite;
    margin:20px auto;
  }
  @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
  #loading p { font-size:16px; margin-top:10px; }

  /* HALAMAN 2 PILIHAN */
  #page2 { display:none; padding:20px; }
  #page2 h2 { font-size:20px; margin-bottom:20px; color:#00ff88; }
  .btn-live {
    display:block; text-decoration:none; color:#fff; font-weight:bold;
    padding:18px; margin:12px 0; border-radius:12px; font-size:17px;
    transition:0.3s;
  }
  .btn-trafee { background:#ff6b00; box-shadow:0 4px 15px rgba(255,107,0,0.4); }
  .btn-trafee:hover { transform:translateY(-2px); }
  .btn-imo { background:#28a745; box-shadow:0 4px 15px rgba(40,167,69,0.4); }
  .btn-imo:hover { transform:translateY(-2px); }
  .note { font-size:11px; color:#888; margin-top:15px; }
</style>
</head>
<body>
<div class="container">

  <!-- HALAMAN 1: TAMPILAN FB -->
  <div id="page1">
    <img src="https://i.imgur.com/xxxxx.jpg" alt="Live Streaming" onclick="showLoading()">
    <h1>LIVE ON PRIVATE STREAMING 🔥</h1>
    <div class="cta-btn" onclick="showLoading()">▶️ CONTINUE</div>
  </div>

  <!-- HALAMAN LOADING 3 DETIK -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Connecting to private server...</p>
    <p>Please wait 3 seconds</p>
  </div>

  <!-- HALAMAN 2: OPSI LINK -->
  <div id="page2">
    <h2>✅ Server Found!</h2>
    <p style="margin-bottom:20px;">Pilih 1 server untuk join live</p>
    
    <!-- GANTI LINK CPA MU -->
    <a href="https://trafee.com/your-link?s1=fbpre" class="btn-live btn-trafee" target="_blank">🔥 JOIN LIVE NOW - Server 1</a>
    
    <a href="https://imonetizeit.com/your-link?sub1=fbpre" class="btn-live btn-imo" target="_blank">⚡ JOIN LIVE NOW - Server 2</a>
    
    <p class="note">*Selesaikan verifikasi 1 langkah untuk akses penuh</p>
  </div>

</div>

<script>
function showLoading() {
  document.getElementById('page1').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  
  setTimeout(function(){
    document.getElementById('loading').style.display = 'none';
    document.getElementById('page2').style.display = 'block';
  }, 3000); // 3 detik
}
</script>

</body>
</html>
